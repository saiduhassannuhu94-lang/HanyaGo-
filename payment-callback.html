<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073750"><title>Payment status | HanyaGo</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-shell.css"><style>body{background:#f3f7f5}.payment-shell{max-width:650px;margin:9vh auto;padding:20px}.payment-card{background:white;border:1px solid #e0e9e4;border-radius:22px;padding:clamp(24px,5vw,45px);box-shadow:0 18px 50px #092f4010}.payment-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:#e3f5eb;color:#087c52;font-size:1.7rem;font-weight:900}.payment-card h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:23px 0 10px;color:#092f40}.payment-card p{color:#61737b;line-height:1.8}.payment-status{margin:20px 0;padding:15px;border:1px solid #dfe9e4;background:#f8fbf9;border-radius:11px;line-height:1.7;overflow-wrap:anywhere}.payment-status.error{background:#fff2ef;border-color:#f1d1c8;color:#873728}.payment-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.payment-actions a{padding:12px 16px;border-radius:9px;text-decoration:none;font-weight:800;background:#087c52;color:white}.payment-actions a.secondary{background:#eff5f1;color:#234651}.payment-reference{font-family:ui-monospace,monospace;font-size:.84rem;overflow-wrap:anywhere}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="config.js" defer></script></head><body><main class="payment-shell"><section class="payment-card"><div class="payment-icon" id="icon">↻</div><span class="keke-section-label">HANYAGO / SECURE CHECKOUT</span><h1 id="heading">Verifying your payment</h1><p id="intro">We are checking the transaction directly with Paystack. Please keep this page open for a moment.</p><div class="payment-status" id="result" role="status" aria-live="polite">Checking transaction reference…</div><div class="payment-actions"><a href="booking.html">My bookings</a><a href="rides.html" class="secondary">Explore rides</a></div></section></main><script>
(function(){"use strict";const $=id=>document.getElementById(id);function finish(title,copy,ok){$("heading").textContent=title;$("intro").textContent=copy;$("icon").textContent=ok?"✓":"!";$("result").textContent=copy;$("result").className="payment-status"+(ok?"":" error")}async function run(){const params=new URLSearchParams(location.search);const reference=params.get("reference")||params.get("trxref");if(!reference){finish("No payment reference found","We could not find a Paystack transaction reference in the return link. Open your booking page to check your request.",false);return}const c=window.HANYAGO_CONFIG;if(!window.supabase||!c||!window.hanyagoIsConfigured()){finish("Payment status unavailable","HanyaGo could not connect to the verification service. Do not assume the payment succeeded. Contact support with reference "+reference+".",false);return}const db=window.supabase.createClient(c.supabaseUrl,c.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:sessionData,error:sessionError}=await db.auth.getSession();if(sessionError||!sessionData.session){finish("Sign in to verify","Your transaction reference is "+reference+". Sign in with the account used to book, then check the booking status. Do not pay again until the status is checked.",false);return}try{const {data,error}=await db.functions.invoke("paystack-checkout",{body:{action:"verify",reference}});if(error)throw error;if(data.status==="success"){ $("heading").textContent="Payment verified";$("icon").textContent="✓";$("intro").textContent="Paystack confirmed the payment. Your ride still needs operator confirmation."; $("result").className="payment-status";$("result").innerHTML="<strong>Payment status:</strong> Paid<br><strong>Amount:</strong> ₦"+(Number(data.amount_kobo)/100).toLocaleString("en-NG")+"<br><strong>Payment reference:</strong> <span class='payment-reference'></span>";$("result").querySelector(".payment-reference").textContent=reference;}else{finish("Payment not confirmed yet","Paystack reports the current status as "+data.status+". Do not make another payment immediately. Check your booking again or contact support if money was deducted.",false)}}catch(e){console.error("Payment callback verification failed",e);finish("Could not verify payment","The payment could not be verified from this page. Do not treat the redirect as proof of payment. Contact HanyaGo support with reference "+reference+".",false)}}window.addEventListener("load",run)})();
</script></body></html>
